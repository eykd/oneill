repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy src tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (100% branch coverage)
        entry: uv run pytest -q
        language: system
        types_or: [python, toml]
        pass_filenames: false
